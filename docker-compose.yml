services:
  db:
    image: postgres:16-alpine
    container_name: docvault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docvault_pass}
      POSTGRES_DB: ${POSTGRES_DB:-docvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docvault} -d ${POSTGRES_DB:-docvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docvault_backend
    restart: unless-stopped
    environment:
      DOCVAULT_DATABASE_URL: postgresql://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault_pass}@db:5432/${POSTGRES_DB:-docvault}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docvault_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
